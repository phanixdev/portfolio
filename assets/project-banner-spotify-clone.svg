<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spotify clone frontend architecture banner</title>
  <desc id="desc">Whiteboard style frontend architecture diagram for a Spotify clone.</desc>
  <defs><style>.bg{fill:#fffdfa}.ink{fill:none;stroke:#151515;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.dash{stroke-dasharray:11 10}.blue{stroke:#2672d8}.green{stroke:#15975b}.purple{stroke:#7d43c7}.orange{stroke:#c67a00}.txt{font-family:"Segoe Print","Comic Sans MS",Arial,sans-serif;fill:#151515;font-weight:700}.small{font-size:22px}.tiny{font-size:17px}.mid{font-size:30px}.big{font-size:52px}.box{fill:#fffefa}.soft-blue{fill:#edf6ff}.soft-green{fill:#eefbf2}.soft-purple{fill:#f5efff}.soft-orange{fill:#fff6e5}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#151515" stroke-width="1.8"/></marker><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer></filter></defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="900" filter="url(#paper)" opacity=".55"/>
  <text class="txt big" x="800" y="70" text-anchor="middle">Spotify Clone Frontend</text><text class="txt small" x="800" y="108" text-anchor="middle">responsive music UI with playlists, controls, and browser-side DOM behavior</text>
  <g transform="translate(70 160)"><rect class="soft-blue ink blue" width="270" height="360" rx="18"/><text class="txt mid" x="135" y="48" text-anchor="middle">HTML Shell</text><text class="txt tiny" x="40" y="95">sidebar</text><text class="txt tiny" x="40" y="128">playlist cards</text><text class="txt tiny" x="40" y="161">player bar</text><text class="txt tiny" x="40" y="194">audio elements</text></g>
  <g transform="translate(445 135)"><rect class="soft-green ink green" width="330" height="420" rx="22"/><text class="txt mid" x="165" y="48" text-anchor="middle">CSS System</text><rect class="box ink green thin" x="40" y="92" width="250" height="64" rx="12"/><text class="txt tiny" x="165" y="132" text-anchor="middle">layout grid</text><rect class="box ink green thin" x="40" y="184" width="250" height="64" rx="12"/><text class="txt tiny" x="165" y="224" text-anchor="middle">responsive cards</text><rect class="box ink green thin" x="40" y="276" width="250" height="64" rx="12"/><text class="txt tiny" x="165" y="316" text-anchor="middle">player styling</text></g>
  <g transform="translate(880 145)"><rect class="soft-purple ink purple" width="330" height="400" rx="22"/><text class="txt mid" x="165" y="48" text-anchor="middle">JavaScript Layer</text><rect class="box ink purple thin" x="40" y="92" width="250" height="62" rx="12"/><text class="txt tiny" x="165" y="130" text-anchor="middle">DOM queries</text><rect class="box ink purple thin" x="40" y="180" width="250" height="62" rx="12"/><text class="txt tiny" x="165" y="218" text-anchor="middle">playback controls</text><rect class="box ink purple thin" x="40" y="268" width="250" height="62" rx="12"/><text class="txt tiny" x="165" y="306" text-anchor="middle">state updates</text></g>
  <g transform="translate(1290 190)"><rect class="soft-orange ink orange" width="245" height="260" rx="18"/><text class="txt mid" x="122" y="48" text-anchor="middle">Browser UI</text><text class="txt tiny" x="36" y="95">music player</text><text class="txt tiny" x="36" y="128">playlist browsing</text><text class="txt tiny" x="36" y="161">visual feedback</text></g>
  <g class="ink" marker-end="url(#arrow)"><path class="blue" d="M340 340 C385 335 400 335 445 335"/><path class="green" d="M775 335 C820 335 835 335 880 335"/><path class="purple" d="M1210 335 C1245 330 1255 325 1290 325"/><path class="dash orange" d="M1410 450 C1240 610 730 650 200 520"/></g>
  <g transform="translate(130 625)"><rect class="soft-blue ink blue" width="245" height="58" rx="12"/><text class="txt small" x="122" y="38" text-anchor="middle">semantic layout</text><rect class="soft-green ink green" x="300" width="245" height="58" rx="12"/><text class="txt small" x="422" y="38" text-anchor="middle">responsive design</text><rect class="soft-purple ink purple" x="600" width="245" height="58" rx="12"/><text class="txt small" x="722" y="38" text-anchor="middle">DOM controls</text><rect class="soft-orange ink orange" x="900" width="245" height="58" rx="12"/><text class="txt small" x="1022" y="38" text-anchor="middle">player feedback</text></g>
</svg>
