<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lottery smart contract architecture banner</title>
  <desc id="desc">Whiteboard style lottery smart contract flow diagram.</desc>
  <defs><style>.bg{fill:#fffdfa}.ink{fill:none;stroke:#151515;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.dash{stroke-dasharray:11 10}.blue{stroke:#2672d8}.green{stroke:#15975b}.purple{stroke:#7d43c7}.orange{stroke:#c67a00}.txt{font-family:"Segoe Print","Comic Sans MS",Arial,sans-serif;fill:#151515;font-weight:700}.small{font-size:22px}.tiny{font-size:17px}.mid{font-size:30px}.big{font-size:52px}.box{fill:#fffefa}.soft-blue{fill:#edf6ff}.soft-green{fill:#eefbf2}.soft-purple{fill:#f5efff}.soft-orange{fill:#fff6e5}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#151515" stroke-width="1.8"/></marker><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer></filter></defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="900" filter="url(#paper)" opacity=".55"/>
  <text class="txt big" x="800" y="70" text-anchor="middle">Lottery Smart Contract</text><text class="txt small" x="800" y="108" text-anchor="middle">participant entry, prize pool, manager draw, winner payout, and round reset</text>
  <g transform="translate(70 185)"><rect class="box ink" width="245" height="300" rx="18"/><text class="txt mid" x="122" y="48" text-anchor="middle">Players</text><text class="txt tiny" x="34" y="95">enter lottery</text><text class="txt tiny" x="34" y="128">send fixed ETH</text><text class="txt tiny" x="34" y="161">wait for draw</text></g>
  <g transform="translate(420 155)"><rect class="soft-purple ink purple" width="360" height="390" rx="22"/><text class="txt mid" x="180" y="48" text-anchor="middle">Lottery Contract</text><rect class="box ink purple thin" x="42" y="92" width="276" height="62" rx="12"/><text class="txt tiny" x="180" y="130" text-anchor="middle">players array</text><rect class="box ink purple thin" x="42" y="184" width="276" height="62" rx="12"/><text class="txt tiny" x="180" y="222" text-anchor="middle">contract pot</text><rect class="box ink purple thin" x="42" y="276" width="276" height="62" rx="12"/><text class="txt tiny" x="180" y="314" text-anchor="middle">winner selection</text></g>
  <g transform="translate(895 150)"><rect class="soft-orange ink orange" width="285" height="160" rx="18"/><text class="txt mid" x="142" y="46" text-anchor="middle">Manager</text><text class="txt tiny" x="42" y="92">restricted draw call</text><text class="txt tiny" x="42" y="124">balance inspection</text></g>
  <g transform="translate(1225 190)"><rect class="soft-green ink green" width="260" height="190" rx="18"/><text class="txt mid" x="130" y="46" text-anchor="middle">Winner</text><text class="txt tiny" x="42" y="92">receives full pot</text><text class="txt tiny" x="42" y="124">round closes</text></g>
  <g transform="translate(895 475)"><rect class="soft-blue ink blue" width="410" height="135" rx="18"/><text class="txt mid" x="205" y="44" text-anchor="middle">Round Reset</text><text class="txt tiny" x="46" y="88">players cleared for next lottery cycle</text></g>
  <g class="ink" marker-end="url(#arrow)"><path class="blue" d="M315 335 C365 335 370 335 420 335"/><path class="orange" d="M1038 310 C980 360 920 390 780 400"/><path class="green" d="M780 350 C960 300 1080 285 1225 285"/><path class="dash blue" d="M1098 475 C980 450 860 485 780 510"/></g>
  <g transform="translate(110 610)"><rect class="soft-blue ink blue" width="245" height="58" rx="12"/><text class="txt small" x="122" y="38" text-anchor="middle">entry tracking</text><rect class="soft-green ink green" y="84" width="245" height="58" rx="12"/><text class="txt small" x="122" y="122" text-anchor="middle">manager control</text><rect class="soft-orange ink orange" y="168" width="245" height="58" rx="12"/><text class="txt small" x="122" y="206" text-anchor="middle">automatic payout</text></g>
</svg>
