<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Crowdfunding smart contract architecture banner</title>
  <desc id="desc">Whiteboard style diagram for a crowdfunding Solidity smart contract.</desc>
  <defs><style>.bg{fill:#fffdfa}.ink{fill:none;stroke:#151515;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.dash{stroke-dasharray:11 10}.blue{stroke:#2672d8}.green{stroke:#15975b}.purple{stroke:#7d43c7}.orange{stroke:#c67a00}.txt{font-family:"Segoe Print","Comic Sans MS",Arial,sans-serif;fill:#151515;font-weight:700}.small{font-size:22px}.tiny{font-size:17px}.mid{font-size:30px}.big{font-size:52px}.box{fill:#fffefa}.soft-blue{fill:#edf6ff}.soft-green{fill:#eefbf2}.soft-purple{fill:#f5efff}.soft-orange{fill:#fff6e5}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#151515" stroke-width="1.8"/></marker><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer></filter></defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="900" filter="url(#paper)" opacity=".55"/>
  <text class="txt big" x="800" y="70" text-anchor="middle">Crowd-Funding Smart Contract</text><text class="txt small" x="800" y="108" text-anchor="middle">contributors fund a campaign, vote on spend requests, and recover funds when goals fail</text>
  <g transform="translate(60 160)"><rect class="box ink" width="260" height="330" rx="18"/><text class="txt mid" x="130" y="48" text-anchor="middle">Contributors</text><text class="txt tiny" x="38" y="92">wallets send ETH</text><text class="txt tiny" x="38" y="126">minimum contribution</text><text class="txt tiny" x="38" y="160">vote on requests</text><text class="txt tiny" x="38" y="194">claim refund if needed</text></g>
  <g transform="translate(420 120)"><rect class="soft-purple ink purple" width="370" height="480" rx="22"/><text class="txt mid" x="185" y="48" text-anchor="middle">Solidity Contract</text><rect class="box ink purple thin" x="42" y="90" width="286" height="62" rx="12"/><text class="txt tiny" x="185" y="128" text-anchor="middle">contribution ledger</text><rect class="box ink purple thin" x="42" y="178" width="286" height="62" rx="12"/><text class="txt tiny" x="185" y="216" text-anchor="middle">deadline + goal checks</text><rect class="box ink purple thin" x="42" y="266" width="286" height="62" rx="12"/><text class="txt tiny" x="185" y="304" text-anchor="middle">refund rules</text><rect class="box ink purple thin" x="42" y="354" width="286" height="62" rx="12"/><text class="txt tiny" x="185" y="392" text-anchor="middle">spending proposals</text></g>
  <g transform="translate(910 160)"><rect class="soft-orange ink orange" width="260" height="180" rx="18"/><text class="txt mid" x="130" y="46" text-anchor="middle">Manager</text><text class="txt tiny" x="38" y="92">creates request</text><text class="txt tiny" x="38" y="126">controlled payout</text></g>
  <g transform="translate(1230 160)"><rect class="soft-green ink green" width="270" height="180" rx="18"/><text class="txt mid" x="135" y="46" text-anchor="middle">Recipient</text><text class="txt tiny" x="38" y="92">receives approved funds</text><text class="txt tiny" x="38" y="126">transparent transfer</text></g>
  <g transform="translate(910 440)"><rect class="soft-blue ink blue" width="390" height="155" rx="18"/><text class="txt mid" x="195" y="44" text-anchor="middle">Campaign Outcomes</text><text class="txt tiny" x="42" y="88">goal met -> request voting + transfer</text><text class="txt tiny" x="42" y="120">goal missed -> contributors refund</text></g>
  <g class="ink" marker-end="url(#arrow)"><path class="blue" d="M320 305 C365 305 375 302 420 302"/><path class="purple" d="M790 265 C845 230 855 230 910 230"/><path class="orange" d="M1170 250 C1195 250 1205 250 1230 250"/><path class="green" d="M790 450 C840 485 860 510 910 510"/><path class="dash blue" d="M505 600 C400 650 265 640 195 490"/></g>
  <g transform="translate(100 610)"><rect class="soft-blue ink blue" width="255" height="58" rx="12"/><text class="txt small" x="127" y="38" text-anchor="middle">minimum funding</text><rect class="soft-green ink green" y="84" width="255" height="58" rx="12"/><text class="txt small" x="127" y="122" text-anchor="middle">refund protection</text><rect class="soft-orange ink orange" y="168" width="255" height="58" rx="12"/><text class="txt small" x="127" y="206" text-anchor="middle">voted spending</text></g>
</svg>
