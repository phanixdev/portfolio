<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Multi-VM cloud deployment architecture banner</title>
  <desc id="desc">Whiteboard style cloud infrastructure diagram with Terraform, gateway, and private workers.</desc>
  <defs>
    <style>.bg{fill:#fffdfa}.ink{fill:none;stroke:#151515;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.dash{stroke-dasharray:11 10}.blue{stroke:#2672d8}.green{stroke:#15975b}.purple{stroke:#7d43c7}.orange{stroke:#c67a00}.txt{font-family:"Segoe Print","Comic Sans MS",Arial,sans-serif;fill:#151515;font-weight:700}.small{font-size:22px}.tiny{font-size:17px}.mid{font-size:30px}.big{font-size:52px}.box{fill:#fffefa}.soft-blue{fill:#edf6ff}.soft-green{fill:#eefbf2}.soft-purple{fill:#f5efff}.soft-orange{fill:#fff6e5}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#151515" stroke-width="1.8"/></marker>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer></filter>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="900" filter="url(#paper)" opacity=".55"/>
  <text class="txt big" x="800" y="70" text-anchor="middle">Multi-VM Cloud Deployment</text>
  <text class="txt small" x="800" y="108" text-anchor="middle">Terraform-provisioned public gateway plus private compute workers</text>
  <g transform="translate(60 170)"><rect class="soft-orange ink orange" width="245" height="210" rx="18"/><text class="txt mid" x="122" y="48" text-anchor="middle">Terraform</text><text class="txt tiny" x="34" y="92">VPC / subnets</text><text class="txt tiny" x="34" y="125">routes / NAT</text><text class="txt tiny" x="34" y="158">security groups</text></g>
  <g transform="translate(390 150)"><rect class="soft-blue ink blue" width="260" height="470" rx="22"/><text class="txt mid" x="130" y="48" text-anchor="middle">AWS / GCP</text><rect class="box ink blue thin" x="34" y="88" width="192" height="84" rx="14"/><text class="txt small" x="130" y="136" text-anchor="middle">Network</text><rect class="box ink blue thin" x="34" y="204" width="192" height="84" rx="14"/><text class="txt small" x="130" y="252" text-anchor="middle">VMs</text><rect class="box ink blue thin" x="34" y="320" width="192" height="84" rx="14"/><text class="txt small" x="130" y="368" text-anchor="middle">Firewall</text></g>
  <g transform="translate(750 120)"><rect class="soft-purple ink purple" width="310" height="170" rx="18"/><text class="txt mid" x="155" y="46" text-anchor="middle">Public Gateway</text><text class="txt tiny" x="45" y="92">nginx reverse proxy</text><text class="txt tiny" x="45" y="124">stable API entry</text></g>
  <g transform="translate(720 360)"><rect class="soft-green ink green" width="370" height="310" rx="22"/><text class="txt mid" x="185" y="46" text-anchor="middle">Private Service Layer</text><rect class="box ink green thin" x="38" y="82" width="295" height="50" rx="12"/><text class="txt tiny" x="185" y="114" text-anchor="middle">iii engine VM</text><rect class="box ink green thin" x="38" y="152" width="295" height="50" rx="12"/><text class="txt tiny" x="185" y="184" text-anchor="middle">TypeScript worker</text><rect class="box ink green thin" x="38" y="222" width="295" height="50" rx="12"/><text class="txt tiny" x="185" y="254" text-anchor="middle">Python / inference workers</text></g>
  <g transform="translate(1190 170)"><rect class="box ink" width="295" height="250" rx="18"/><text class="txt mid" x="147" y="46" text-anchor="middle">Automation</text><text class="txt tiny" x="38" y="90">Bash bootstrap</text><text class="txt tiny" x="38" y="124">systemd units</text><text class="txt tiny" x="38" y="158">GitHub deploy</text><text class="txt tiny" x="38" y="192">validation checks</text></g>
  <g transform="translate(1120 540)"><rect class="soft-orange ink orange" width="335" height="135" rx="16"/><text class="txt mid" x="167" y="44" text-anchor="middle">Observability</text><text class="txt tiny" x="42" y="88">logs, service status, health checks</text></g>
  <g class="ink" marker-end="url(#arrow)"><path class="orange" d="M305 275 C345 275 350 270 390 270"/><path class="blue" d="M650 275 C690 245 705 225 750 220"/><path class="purple" d="M905 290 C905 320 905 335 905 360"/><path class="green" d="M1060 445 C1110 405 1130 330 1190 295"/><path class="dash purple" d="M1060 555 C1110 565 1140 590 1120 606"/></g>
  <g transform="translate(85 600)"><rect class="soft-blue ink blue" width="250" height="58" rx="12"/><text class="txt small" x="125" y="38" text-anchor="middle">IaC repeatability</text><rect class="soft-green ink green" y="84" width="250" height="58" rx="12"/><text class="txt small" x="125" y="122" text-anchor="middle">private workers</text><rect class="soft-orange ink orange" y="168" width="250" height="58" rx="12"/><text class="txt small" x="125" y="206" text-anchor="middle">gateway boundary</text></g>
</svg>
