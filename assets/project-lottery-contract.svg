<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Lottery smart contract illustration</title>
  <desc id="desc">A colorful blockchain lottery wheel with participant nodes and winner selection.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="760" height="430" rx="28" fill="#030303"/>
  <g opacity=".18" stroke="#6ca8ff" stroke-width="1">
    <path d="M0 92h760M0 184h760M0 276h760M0 368h760"/>
    <path d="M126 0v430M252 0v430M378 0v430M504 0v430M630 0v430"/>
  </g>
  <circle cx="382" cy="202" r="122" fill="#10162c" stroke="#8fffd2" stroke-width="7" filter="url(#glow)"/>
  <path d="M382 80v244M260 202h244M296 116l172 172M468 116 296 288" stroke="#ffdf7d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="382" cy="202" r="42" fill="#ff7ab6"/>
